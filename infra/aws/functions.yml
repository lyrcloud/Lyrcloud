AWSTemplateFormatVersion: '2010-09-09'
Description: Lyrcloud Edge Functions - deploy JavaScript fetch handlers from the lyrcloud CLI and serve them at <name>.<FunctionsDomain>.
# Deploy with scripts/deploy-functions.sh. Lambda source: api/functions/ (plus api/account/roles.mjs and
# api/domains/lyrca.mjs). Each customer function is a Lambda function named lyrfn-<name> that the API
# creates; its address is an API Gateway custom domain mapped to IngressApi, and the .lyr registry
# (in the domains table) gets a CNAME for it.

Parameters:
  ArtifactsBucketName:
    Type: String
    Default: lyrcloud-deploy-artifacts
  LambdaCodeS3Key:
    Type: String
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  FunctionsDomain:
    Type: String
    Default: dev.lyr
  DomainsTableName:
    Type: String
    Default: lyrcloud-domains
  LyrCaSecretName:
    Type: String
    Default: lyrcloud/lyr-ca
  UsersTableName:
    Type: String
    Default: lyrcloud-users
  SuperAdminEmail:
    Type: String
    Default: lyrclouds@gmail.com
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'https://www.lyrcloud.com,http://localhost:5173'

Resources:
  # ---------------------------------------------------------------- data

  FunctionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lyrcloud-functions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: ownerId, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: byOwner
          KeySchema:
            - { AttributeName: ownerId, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # ---------------------------------------------------------------- storage (KV and buckets)

  # KV namespaces: pk "kv#<owner>#<namespace>", sk the key. Expired keys are removed by TTL.
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lyrcloud-functions-data
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # Buckets: objects at <owner>/<bucket>/<key>. Private; only the platform and API functions read it.
  ObjectsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'lyrcloud-functions-objects-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  # Signs each function's storage token (see api/functions/storage.mjs signToken).
  PlatformSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: lyrcloud/functions-platform
      Description: Signs Lyrcloud Edge Functions storage tokens.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  PlatformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt DataTable.Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}'
              # AI Gateway: only the catalog in api/functions/ai.mjs (US inference profiles route to any US region).
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${ObjectsBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ObjectsBucket.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PlatformSecret

  # Called by deployed functions' env bindings.
  PlatformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lyrcloud-functions-platform
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: functions/platform.handler
      Role: !GetAtt PlatformRole.Arn
      MemorySize: 512
      Timeout: 60 # AI calls can take a while; functions themselves stop at 25 s
      Environment:
        Variables:
          DATA_TABLE_NAME: !Ref DataTable
          OBJECTS_BUCKET: !Ref ObjectsBucket
          PLATFORM_SECRET_NAME: !Ref PlatformSecret
          USERS_TABLE_NAME: !Ref UsersTableName
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref LambdaCodeS3Key

  # ---------------------------------------------------------------- customer functions

  # What customer code runs as: it may write its own logs and call the platform function (which only
  # serves the data its signed token allows), and nothing else.
  CustomerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OwnLogsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/lyrfn-*:*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PlatformFunction.Arn

  # ---------------------------------------------------------------- control API (used by the CLI)

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EdgeFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
                Resource: [!GetAtt FunctionsTable.Arn, !Sub '${FunctionsTable.Arn}/index/*']
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}'
              # Only the dev.lyr registry item.
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DomainsTableName}'
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [!Sub 'lyr#${FunctionsDomain}']
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:TagResource
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:lyrfn-*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CustomerFunctionRole.Arn
                Condition:
                  StringEquals: { 'iam:PassedToService': lambda.amazonaws.com }
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:PutRetentionPolicy, logs:DeleteLogGroup, logs:FilterLogEvents, logs:TagResource]
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/lyrfn-*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/lyrfn-*:*'
              - Effect: Allow
                Action: [apigateway:GET, apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE]
                Resource:
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/domainnames'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/domainnames/*'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/tags/*'
              - Effect: Allow
                Action: [acm:ImportCertificate, acm:AddTagsToCertificate, acm:DescribeCertificate]
                Resource: '*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${LyrCaSecretName}-*'
                  - !Ref PlatformSecret
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt DataTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${ObjectsBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ObjectsBucket.Arn
              # AI Gateway: only the catalog in api/functions/ai.mjs (US inference profiles route to any US region).
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lyrcloud-functions
      Runtime: nodejs22.x
      Handler: functions/index.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          TABLE_NAME: !Ref FunctionsTable
          USERS_TABLE_NAME: !Ref UsersTableName
          DOMAINS_TABLE_NAME: !Ref DomainsTableName
          FUNCTIONS_DOMAIN: !Ref FunctionsDomain
          EXEC_ROLE_ARN: !GetAtt CustomerFunctionRole.Arn
          INGRESS_API_ID: !Ref IngressApi
          LYR_CA_SECRET_NAME: !Ref LyrCaSecretName
          SUPER_ADMIN_EMAIL: !Ref SuperAdminEmail
          DATA_TABLE_NAME: !Ref DataTable
          OBJECTS_BUCKET: !Ref ObjectsBucket
          PLATFORM_SECRET_NAME: !Ref PlatformSecret
          PLATFORM_FUNCTION: !Ref PlatformFunction
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref LambdaCodeS3Key

  ControlApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lyrcloud-functions-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ControlApi
      AuthorizerType: JWT
      Name: CognitoJwtAuthorizer
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClientId]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'

  ControlIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ControlApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'GET /functions', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'GET /functions/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  PutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'PUT /functions/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  FunctionPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'POST /functions/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  DeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'DELETE /functions/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  StorageListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'GET /storage', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  StorageGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'GET /storage/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  StoragePutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'PUT /storage/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  StorageDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'DELETE /storage/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  AiGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'GET /ai/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  AiPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'POST /ai/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  AccessPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'POST /access/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }
  AdminRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref ControlApi, RouteKey: 'GET /admin/{proxy+}', Target: !Sub 'integrations/${ControlIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer }

  ControlStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ControlApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ControlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/*'

  # Keeps the *.dev.lyr certificate (90 days) renewed well before it runs out.
  CertificateRenewal:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 day)
      Targets:
        - Arn: !GetAtt ApiFunction.Arn
          Id: renew-certificate
          Input: '{"task":"renew-certificate"}'
  CertificateRenewalPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CertificateRenewal.Arn

  # ---------------------------------------------------------------- serving <name>.dev.lyr

  RouterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeCustomerFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:lyrfn-*'
              # Access, Security and the cache: read each function's settings, sign sessions, mark
              # tickets used, count rate limits, write the security log, read and store cached answers.
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt FunctionsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt DataTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PlatformSecret

  RouterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lyrcloud-functions-router
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: functions/router.handler
      Role: !GetAtt RouterRole.Arn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          FUNCTIONS_DOMAIN: !Ref FunctionsDomain
          FUNCTIONS_TABLE: !Ref FunctionsTable
          DATA_TABLE_NAME: !Ref DataTable
          PLATFORM_SECRET_NAME: !Ref PlatformSecret
          ACCESS_URL: https://www.lyrcloud.com/access/
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref LambdaCodeS3Key

  # Reached only through the <name>.dev.lyr custom domains, never its execute-api address.
  IngressApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lyrcloud-functions-ingress
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: true

  IngressIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IngressApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RouterFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  IngressRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref IngressApi, RouteKey: '$default', Target: !Sub 'integrations/${IngressIntegration}' }

  IngressStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref IngressApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 500
        ThrottlingRateLimit: 200

  IngressInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RouterFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IngressApi}/*'

  # The origin for customer domains on the Lyrcloud CDN (infra/aws/sites.yml). Public, but the router answers
  # it only when CloudFront's secret origin header is present; the function comes from the origin path.
  RouterUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt RouterFunction.Arn
      AuthType: NONE

  RouterUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RouterFunction
      Principal: '*'
      FunctionUrlAuthType: NONE

  RouterUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RouterFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  RouterUrl:
    Value: !GetAtt RouterUrl.FunctionUrl
  FunctionsApiBaseUrl:
    Value: !GetAtt ControlApi.ApiEndpoint
  IngressApiId:
    Value: !Ref IngressApi
  FunctionsDomain:
    Value: !Ref FunctionsDomain
