AWSTemplateFormatVersion: '2010-09-09'
Description: Lyrcloud account API (profile, mobile verification, welcome and update emails, admin user management) backed by DynamoDB, protected by a Cognito JWT authorizer, plus the public Lyrbot help assistant.
# Deploy with scripts/deploy-account-api.sh; Lambda source is in api/account/.

Parameters:
  ArtifactsBucketName:
    Type: String
  LambdaCodeS3Key:
    Type: String
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'https://www.lyrcloud.com,http://localhost:5173'
  SuperAdminEmail:
    Type: String
    Default: lyrclouds@gmail.com
  AnthropicSecretName:
    Type: String
    Default: lyrshop/anthropic
    Description: Secrets Manager secret holding the Anthropic API key Lyrbot uses (shared with Lyrshop and Lyrsoft). Blank turns Lyrbot off.

  MailFrom:
    Type: String
    Default: 'Lyrcloud <no-reply@lyrcloud.com>'
    Description: Sender of the welcome and update emails; its domain must be a verified SES identity. Blank turns email off.
  MailReplyTo:
    Type: String
    Default: support@lyrcloud.com
  SmsSenderId:
    Type: String
    Default: ''
    Description: Optional alphanumeric sender ID for verification texts, where the destination country allows one.

Conditions:
  HasAnthropicSecret: !Not [!Equals [!Ref AnthropicSecretName, '']]

Resources:
  # Signs unsubscribe links and mobile verification codes.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/app-secret'
      Description: Signs Lyrcloud unsubscribe links and mobile verification codes.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lyrcloud-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # Lyrbot use counters per visitor per hour and for the whole site per day.
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lyrcloud-rate-limits
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
        - AttributeName: period
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
        - AttributeName: period
          KeyType: RANGE

  AccountApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UsersTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:DeleteItem
                Resource: !GetAtt UsersTable.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt RateLimitTable.Arn
        - PolicyName: UserPoolAdmin
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Disable/enable, sign out everywhere and delete accounts from the admin console.
              - Effect: Allow
                Action:
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminUserGlobalSignOut
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminGetUser
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'
        - PolicyName: MessagesAndSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Welcome and update emails. identity/* because the SES sandbox also checks the recipient.
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              # Verification texts go straight to a phone number, which has no ARN.
              - Effect: Allow
                Action: sns:Publish
                Resource: '*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
        - !If
          - HasAnthropicSecret
          - PolicyName: LyrbotSecret
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-*'
          - !Ref AWS::NoValue

  AccountApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-me'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt AccountApiFunctionRole.Arn
      MemorySize: 512
      Timeout: 29 # Lyrbot replies come from Claude; API Gateway waits at most 30 seconds
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
          RATE_TABLE_NAME: !Ref RateLimitTable
          SUPER_ADMIN_EMAIL: !Ref SuperAdminEmail
          USER_POOL_ID: !Ref UserPoolId
          ANTHROPIC_SECRET: !Ref AnthropicSecretName
          APP_SECRET_NAME: !Ref AppSecret
          MAIL_FROM: !Ref MailFrom
          MAIL_REPLY_TO: !Ref MailReplyTo
          SMS_SENDER_ID: !Ref SmsSenderId
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref LambdaCodeS3Key

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - PUT
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: CognitoJwtAuthorizer
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClientId
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AccountApiFunction.Arn
      PayloadFormatVersion: '2.0'

  GetMeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /me'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ListUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /admin/users'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /admin/users/{userId}'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateMeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /me'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DeleteUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /admin/users/{userId}'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  SignOutUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /admin/users/{userId}/sign-out'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  GetSettingsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /admin/settings'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  PutSettingsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /admin/settings'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  SendPhoneCodeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /me/phone'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  VerifyPhoneRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /me/phone/verify'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DeletePhoneRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /me/phone'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ListUpdatesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /admin/updates'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  SendUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /admin/updates'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UnsubscribePageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /public/unsubscribe'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: NONE

  UnsubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /public/unsubscribe'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: NONE

  # Unauthenticated. Throttled here, and per IP in the Lambda.
  LyrbotRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /public/lyrbot'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: NONE

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [LyrbotRoute, SendPhoneCodeRoute, UnsubscribePageRoute, UnsubscribeRoute]
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      RouteSettings:
        'POST /public/lyrbot':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
        'POST /me/phone':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        'GET /public/unsubscribe':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
        'POST /public/unsubscribe':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AccountApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  AccountApiBaseUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  UsersTableName:
    Value: !Ref UsersTable

